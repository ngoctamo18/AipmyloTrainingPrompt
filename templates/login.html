{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<section class="card narrow">
    <h2>Đăng nhập</h2>
    <form method="post">
        <label>Tên đăng nhập
            <input type="text" name="username" required>
        </label>
        <label>Mật khẩu
            <input type="password" name="password" required>
        </label>
        <button type="submit">Đăng nhập</button>
    </form>
</section>
{% endblock %}
